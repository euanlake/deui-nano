name: Firmware Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: firmware-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Parse version from tag
        id: version
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32s3
          path: firmware/esp32
          command: |
            idf.py set-target esp32s3
            idf.py -DPROJECT_VER=${{ steps.version.outputs.version }} build
            VERSION="${{ steps.version.outputs.version }}"
            OTA_NAME="deui_nano-esp32s3-v${VERSION}.bin"
            mkdir -p ../release
            cp build/deui_nano.bin "../release/${OTA_NAME}"

      - name: Package binaries
        id: artifacts
        working-directory: firmware/esp32
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          OTA_NAME="deui_nano-esp32s3-v${VERSION}.bin"
          OTA_PATH="../release/${OTA_NAME}"

          if [ ! -f "$OTA_PATH" ]; then
            echo "Missing artifact: $OTA_PATH" >&2
            exit 1
          fi

          BIN_SIZE=$(stat -c%s "$OTA_PATH")
          MAX=$((0x300000))
          echo "OTA binary size: $BIN_SIZE bytes (max $MAX)"
          if [ "$BIN_SIZE" -gt "$MAX" ]; then
            echo "Binary exceeds OTA slot size (3 MB)" >&2
            exit 1
          fi

          OTA_SHA256=$(sha256sum -b "$OTA_PATH" | awk '{print $1}')
          OTA_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${OTA_NAME}"
          echo "ota_name=${OTA_NAME}" >> "$GITHUB_OUTPUT"
          echo "ota_sha256=${OTA_SHA256}" >> "$GITHUB_OUTPUT"
          echo "ota_url=${OTA_URL}" >> "$GITHUB_OUTPUT"

      - name: Update OTA manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OTA_URL: ${{ steps.artifacts.outputs.ota_url }}
          OTA_SHA256: ${{ steps.artifacts.outputs.ota_sha256 }}
        run: |
          python3 <<'PY'
          import json, os
          version = os.environ["VERSION"]
          ota_url = os.environ["OTA_URL"]
          ota_sha256 = os.environ["OTA_SHA256"]
          ota_manifest = {
              "product": "deui_nano",
              "target": "esp32s3",
              "version": version,
              "url": ota_url,
              "sha256": ota_sha256,
              "notes": f"Release {version}",
          }
          with open("firmware/esp32/ota/manifest.json", "w") as f:
              json.dump(ota_manifest, f, indent=2)
              f.write("\n")
          install_manifest = {
              "name": "DEUI Nano",
              "version": version,
              "new_install_prompt_erase": True,
              "builds": [{
                  "chipFamily": "ESP32-S3",
                  "parts": [{
                      "path": f"firmware/deui_nano-full-flash-v{version}.bin",
                      "offset": 0,
                  }],
              }],
          }
          with open("install/manifest.json", "w") as f:
              json.dump(install_manifest, f, indent=2)
              f.write("\n")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: firmware/release/${{ steps.artifacts.outputs.ota_name }}
          generate_release_notes: true

      - name: Commit manifest updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/esp32/ota/manifest.json install/manifest.json
          if git diff --staged --quiet; then
            echo "No manifest changes to commit"
            exit 0
          fi
          git commit -m "chore(release): update manifests for ${{ steps.version.outputs.tag }}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
